<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="대화하듯 적는 일기장형 할 일·루틴 매니저" />
    <title>하루결 · 대화형 일정 일기장</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 첫 화면 깜빡임 방지: React가 뜨기 전에 저장된 테마를 먼저 적용 -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('harugyeol:settings') || '{}').state || {}
        var t = s.theme || 'system'
        // 밤 자동 어둡게 (src/lib/dayPhase.ts와 같은 규칙)
        var now = new Date()
        var q = new URLSearchParams(location.search).get('hour')
        if (q !== null && /^\d+$/.test(q) && +q < 24) now.setHours(+q, 0, 0, 0)
        var h = now.getHours()
        var night = h >= 19 || h < 7
        var key = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (h < 7 ? 1 : 0))
        var nk = key.getFullYear() + '-' + String(key.getMonth() + 1).padStart(2, '0') + '-' + String(key.getDate()).padStart(2, '0')
        var autoDark = s.nightAutoDark !== false && night && s.nightOverride !== nk
        if (autoDark || t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
